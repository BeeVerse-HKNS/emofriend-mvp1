[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnessing"
version = "0.1.0"
description = "AI OPC (One Person Company) Trainer Framework - Build your AI Agent team with Harness Engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "litellm>=1.0",
    "structlog>=24.0",
    "sqlite-utils>=3.36",
    "pyyaml>=6.0",
    "rich>=13.0",
    "google-api-python-client>=2.0",
    "python-dateutil>=2.8",
    "playwright>=1.40",
    "edge-tts>=6.0",
    "moviepy>=1.0",
    "ffmpeg-python>=0.2",
    "apscheduler>=3.10",
    "pysrt>=1.1",
    "rembg>=2.0",
    "volcengine-python-sdk[ark]>=5.0",
    "google-auth-oauthlib>=1.0",
    "bilibili-api-python>=16.0",
    "instagrapi>=2.0",
    "ollama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
harnessing = "harnessing.cli.main:app"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
